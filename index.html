<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d31">
  <title>El Encanto · Costa Rica</title>

  <style>
    :root {
      --verde: #173d31;
      --crema: #f5f1e6;
      --dorado: #efcf87;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--crema);
      color: var(--verde);
      font: 1rem/1.5 system-ui, sans-serif;
    }

    .portada {
      position: relative;
      isolation: isolate;
      display: grid;
      place-items: center;
      min-height: clamp(300px, 60svh, 660px);
      padding: 1.5rem 1rem 2.75rem;
      overflow: hidden;
      background: radial-gradient(ellipse at top, #356b55, #122e26 80%);
      border-bottom: 4px solid var(--dorado);
    }

    .portada-video,
    .portada::after {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .portada-video {
      z-index: -2;
      object-fit: cover;
    }

    .portada::after {
      content: "";
      z-index: -1;
      background: linear-gradient(#122e2640, #122e2680);
    }

    .emblema {
      display: block;
      width: min(92vw, 860px);
      max-width: 100%;
      height: auto;
      max-height: min(48svh, 500px);
      object-fit: contain;
      filter: drop-shadow(0 4px 12px #0006);
    }

    .emblema[hidden] { display: none; }

    main {
      position: relative;
      width: min(92%, 660px);
      margin: 1rem auto 0;
    }

    h2 {
      margin: 1.5rem 0 .65rem;
      font: 1.35rem Georgia, serif;
    }

    .grupo {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .7rem;
    }

    a {
      display: flex;
      align-items: center;
      gap: .75rem;
      min-height: 66px;
      padding: .85rem 1rem;
      border: 1px solid #dadccf;
      border-radius: 15px;
      background: #fffdf7;
      color: inherit;
      text-decoration: none;
      box-shadow: 0 4px 12px #173d3110;
      transition: background .15s, border-color .15s;
    }

    a:hover {
      background: #e9f0e5;
      border-color: #819b86;
    }

    a:focus-visible {
      outline: 3px solid #9b611c;
      outline-offset: 3px;
    }

    .reserva {
      min-height: 76px;
      background: var(--dorado);
      border-color: #c7a265;
    }

    .reserva strong { font-size: 1.15rem; }
    .reserva:hover { background: #f7dda3; }

    .icono {
      display: grid;
      place-items: center;
      flex: 0 0 2rem;
      height: 2rem;
      border-radius: 50%;
      background: #e7eee4;
      font-weight: bold;
    }

    .reserva .icono { background: #fae7bd; }
    .texto { min-width: 0; overflow-wrap: anywhere; }
    .flecha { margin-left: auto; }
    small { display: block; color: #475d51; }

    footer {
      padding: 2rem 1rem;
      text-align: center;
      font-size: .85rem;
    }

    @media (max-width: 520px) {
      .grupo { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .portada-video { display: none; }
      a { transition: none; }
    }
  </style>
</head>
<body>
  <header class="portada">
    <video class="portada-video" autoplay muted loop playsinline aria-hidden="true">
      <source src="./Portada.mp4" type="video/mp4">
    </video>

    <img
      class="emblema"
      src="./Logo.svg"
      alt="Logo de El Encanto"
      onerror="this.onerror = () => { this.hidden = true; }; this.src = './Logo.png';"
    >
  </header>

  <main>
    <a class="reserva" href="https://airbnb.com/h/elencantoestate"
       target="_blank" rel="noopener">
      <span class="icono" aria-hidden="true">⌂</span>
      <span class="texto">
        <strong>Reserva tu estadía</strong>
        <small>El Encanto Estate en Airbnb</small>
      </span>
      <span class="flecha" aria-hidden="true">↗</span>
    </a>

    <section>
      <h2>Contáctanos</h2>
      <div class="grupo">
        <a href="tel:+50683913653">
          <span class="icono" aria-hidden="true">☎</span>
          <span class="texto"><strong>Llamar</strong><small>+506 8391-3653</small></span>
          <span class="flecha" aria-hidden="true">→</span>
        </a>

        <a href="mailto:elencantocr@gmail.com">
          <span class="icono" aria-hidden="true">✉</span>
          <span class="texto"><strong>Enviar correo</strong><small>elencantocr@gmail.com</small></span>
          <span class="flecha" aria-hidden="true">→</span>
        </a>
      </div>
    </section>

    <section>
      <h2>Cómo llegar</h2>
      <div class="grupo">
        <a href="https://www.google.com/maps/search/?api=1&amp;query=Elencantodreamfarm%2C+Costa+Rica"
           target="_blank" rel="noopener">
          <span class="icono" aria-hidden="true">⌖</span>
          <span class="texto"><strong>El Encanto Dream Farm</strong><small>Buscar en Google Maps</small></span>
          <span class="flecha" aria-hidden="true">↗</span>
        </a>

        <a href="https://www.google.com/maps/search/?api=1&amp;query=Elencantoestate%2C+Costa+Rica"
           target="_blank" rel="noopener">
          <span class="icono" aria-hidden="true">⌖</span>
          <span class="texto"><strong>El Encanto Estate</strong><small>Buscar en Google Maps</small></span>
          <span class="flecha" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>

    <section>
      <h2>Síguenos</h2>
      <div class="grupo">
        <a href="https://www.facebook.com/elencantodreamfarmcostarica/"
           target="_blank" rel="noopener">
          <span class="icono" aria-hidden="true">f</span>
          <strong>Facebook</strong>
          <span class="flecha" aria-hidden="true">↗</span>
        </a>

        <a href="https://www.instagram.com/elencantodreamfarmcostarica/"
           target="_blank" rel="noopener">
          <span class="icono" aria-hidden="true">◎</span>
          <strong>Instagram</strong>
          <span class="flecha" aria-hidden="true">↗</span>
        </a>
      </div>
    </section>
  </main>

  <footer>El Encanto · Costa Rica</footer>
</body>
</html>
